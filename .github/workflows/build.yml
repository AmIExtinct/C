name: Cross Building

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            compiler: gcc
          - os: macos-latest
            platform: macos
            compiler: clang
          - os: ubuntu-latest
            platform: linux
            compiler: gcc
          - os: ubuntu-latest
            platform: linux
            compiler: clang
          - os: windows-latest
            platform: windows
            compiler: clang
          - os: windows-latest
            platform: windows
            compiler: gcc
          - os: windows-latest
            platform: windows
            compiler: msvc

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Install Linux compilers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc clang
          echo "CC=${{ matrix.compiler }}" >> "$GITHUB_ENV"

      - name: Install macOS GCC
        if: runner.os == 'macOS' && matrix.compiler == 'gcc'
        run: |
          brew install gcc
          gcc_version="$(brew list --versions gcc | awk '{print $2}' | cut -d. -f1)"
          compiler="$(brew --prefix gcc)/bin/gcc-$gcc_version"
          test -x "$compiler"
          echo "CC=$compiler" >> "$GITHUB_ENV"

      - name: Select macOS Clang
        if: runner.os == 'macOS' && matrix.compiler == 'clang'
        run: echo "CC=clang" >> "$GITHUB_ENV"

      - name: Install Windows Clang
        if: runner.os == 'Windows' && matrix.compiler == 'clang'
        run: choco install llvm --yes --no-progress

      - name: Install Windows GCC
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Configure Windows GCC path
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\msys64\mingw64\bin'
          Add-Content -Path $env:GITHUB_ENV -Value 'CC=gcc'

      - name: Select Windows Clang
        if: runner.os == 'Windows' && matrix.compiler == 'clang'
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value 'CC=clang'

      - name: Initialize Visual Studio environment
        if: runner.os == 'Windows' && (matrix.compiler == 'msvc' || matrix.compiler == 'clang')
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build with MSVC
        if: matrix.compiler == 'msvc'
        shell: pwsh
        run: |
          xmake f -p windows -a x64 --toolchain=msvc -m release -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build with Windows Clang
        if: runner.os == 'Windows' && matrix.compiler == 'clang'
        shell: pwsh
        run: |
          xmake f -p windows -a x64 --toolchain=clang --cc=clang -m release -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          xmake
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure and build with MinGW GCC
        if: runner.os == 'Windows' && matrix.compiler == 'gcc'
        shell: msys2 {0}
        run: |
          xmake f -p windows -a x64 --toolchain=gcc --cc=gcc -m release -y
          xmake

      - name: Configure and build with GCC or Clang
        if: runner.os != 'Windows'
        shell: bash
        run: |
          xmake f --toolchain=${{ matrix.compiler }} --cc="$CC" -m release -y
          xmake

      - name: Stage application
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            binary="$(find build -type f -name 'slay.exe' -print -quit)"
            extension=.exe
          else
            binary="$(find build -type f -name slay -print -quit)"
            extension=
          fi
          test -n "$binary"
          cp "$binary" "artifacts/slay-${{ matrix.platform }}-${{ matrix.compiler }}$extension"

      - uses: actions/upload-artifact@v4
        with:
          name: slay-${{ matrix.platform }}-${{ matrix.compiler }}
          path: artifacts/*
          if-no-files-found: error

  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Find version in commit message
        id: version
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          version="$(printf '%s' "$COMMIT_MESSAGE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: [build, detect-version]
    if: needs.detect-version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect-version.outputs.version }}
        run: gh release create "$VERSION" release-assets/* --title "$VERSION" --generate-notes

